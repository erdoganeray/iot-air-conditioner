; Klima sistemi — HUB (Seeed XIAO ESP32-S3)
;
; Derleme:            pio run
; USB ile yükleme:    pio run -t upload
; Kablosuz (OTA):     pio run -e hub-ota -t upload   (PIN'i upload_flags'e yazın)
; Seri izleme:        pio device monitor
; Birim testleri:     pio test -e native
;
; Web uygulaması (../../app/index.html) derleme sırasında sıkıştırılıp
; yazılıma gömülür (scripts/embed_app.py).

[platformio]
default_envs = hub

[common]
lib_deps =
    crankyoldgit/IRremoteESP8266@2.9.0
    h2zero/NimBLE-Arduino@2.5.1
    esp32async/ESPAsyncWebServer@3.12.1
    esp32async/AsyncTCP@3.5.0
    bblanchon/ArduinoJson@7.4.3

[env:hub]
platform = espressif32@8.0.0
board = seeed_xiao_esp32s3
framework = arduino
board_build.f_cpu = 160000000L
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_extra_dirs = ../lib
lib_deps = ${common.lib_deps}
extra_scripts = pre:scripts/embed_app.py
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    ; NimBLE: yalnızca çevre birimi (peripheral) rolü
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
build_src_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-missing-field-initializers

; Kablosuz güncelleme: hub ile aynı ağdayken
[env:hub-ota]
extends = env:hub
upload_protocol = espota
upload_port = klima.local
upload_flags =
    --auth=1234

; Masaüstü birim testleri (donanım gerekmez)
[env:native]
platform = native
test_build_src = no
build_flags =
    -std=gnu++17
    -Isrc
    -I../lib/klima_common/src
