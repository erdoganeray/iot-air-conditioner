; Klima sistemi — sıcaklık/nem sensörü (Seeed XIAO ESP32-C3)
;
; Derleme:   pio run
; Yükleme:   pio run -t upload
; Seri izleme (USB takılıyken log basar): pio device monitor
;
; Sürümler sabitlenmiştir: herkes aynı derleyici ve kütüphanelerle derler.

[platformio]
default_envs = sensor

[env:sensor]
platform = espressif32@8.0.0
board = seeed_xiao_esp32c3
framework = arduino
; OTA gerekmediği için tüm flash uygulamaya ayrıldı
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_extra_dirs = ../lib
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Pil ölçüm kalibrasyonu (multimetre / ölçülen değer)
    -DBATT_CAL=1.0f
